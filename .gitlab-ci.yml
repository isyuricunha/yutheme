image: node:24

stages:
  - verify
  - publish

default:
  before_script:
    - corepack enable
    - corepack prepare pnpm@12.3.4 --activate

.pnpm-cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

verify:
  stage: verify
  cache: !reference [.pnpm-cache, cache]
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm type-check
    - pnpm test
    - pnpm build
    - pnpm pack --pack-destination .
    - npm publish --dry-run --access public

publish:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  cache: !reference [.pnpm-cache, cache]
  before_script:
    - EXPECTED_VERSION=${CI_COMMIT_TAG#v}
    - PACKAGE_VERSION=$(node -p "require('./package.json').version")
    - |
      if [ "$EXPECTED_VERSION" != "$PACKAGE_VERSION" ]; then
        echo "tag $CI_COMMIT_TAG does not match package.json version $PACKAGE_VERSION"
        exit 1
      fi
    - NPM_VERSION=$(npm --version)
    - |
      node -e "const [maj, min] = process.argv[1].split('.').map(Number); process.exit(maj > 11 || (maj === 11 && min >= 10) ? 0 : 1)" "$NPM_VERSION"
      || { echo "npm >= 11.10 required for OIDC trusted publishing, found $NPM_VERSION"; exit 1; }
    - corepack enable
    - corepack prepare pnpm@12.3.4 --activate
  script:
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm build
    - npm publish --access public
